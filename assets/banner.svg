<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .pulsing-wave {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .floating-card {
      animation: float 6s ease-in-out infinite alternate;
    }
    .signal-beam {
      animation: dash 8s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; stroke-width: 2; }
      100% { opacity: 0.8; stroke-width: 3.5; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Background Dynamic Elements (Pulsing ECG Waves / Flow graphs) -->
  <g stroke="url(#primaryGrad)" fill="none" opacity="0.4">
    <!-- Grid pattern -->
    <path d="M0,80 H1200 M0,160 H1200 M0,240 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    <path d="M200,0 V320 M400,0 V320 M600,0 V320 M800,0 V320 M1000,0 V320" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

    <!-- Dynamic Waveform Graphic behind text -->
    <path class="pulsing-wave" d="M 50,230 Q 150,210 250,240 T 450,220 T 650,260 T 850,200 T 1050,230 T 1150,210" stroke-linecap="round"/>
    <path class="pulsing-wave" d="M 50,250 Q 200,270 350,230 T 650,220 T 950,250 T 1150,240" stroke="url(#glowGrad)" stroke-linecap="round"/>
  </g>

  <!-- Decorative Right Side Dynamic Tech Elements (Flow Nodes & Cards) -->
  <g class="floating-card" transform="translate(820, 45)">
    <!-- Glassmorphic Card Container -->
    <rect x="0" y="0" width="330" height="230" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    
    <!-- Cardiac ECG Line inside card -->
    <path d="M 20,115 L 70,115 L 85,80 L 100,150 L 120,60 L 140,130 L 155,115 L 210,115 L 225,95 L 240,115 L 310,115" 
          stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Nodes and indicators -->
    <circle cx="120" cy="60" r="5" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="85" cy="80" r="4" fill="#6366f1"/>
    <circle cx="140" cy="130" r="4" fill="#a855f7"/>
    
    <!-- Mini Metric Pills inside right graphic -->
    <rect x="25" y="25" width="130" height="28" rx="6" fill="#ffffff" fill-opacity="0.08" />
    <text x="37" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="600">⚡ AI-Powered CDS</text>
    
    <rect x="170" y="25" width="135" height="28" rx="6" fill="#ffffff" fill-opacity="0.08" />
    <text x="182" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#a855f7" font-weight="600">🩺 Evidence-Based</text>

    <rect x="25" y="175" width="280" height="32" rx="6" fill="#ffffff" fill-opacity="0.06" />
    <text x="37" y="196" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">SaaS Benchmarks &amp; Open Source Repos</text>
  </g>

  <!-- Main Foreground Content (Header, Subtitle, Badges) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="270" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="16" y="19" class="badge-text">🏥 CLINICAL DECISION SUPPORT ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Clinical Decision Support</text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">Curated SaaS Platforms, Point-of-Care AI &amp; Open-Source Medical CDS</text>
    <text x="0" y="200" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">Differential Diagnosis • Medication Safety • FHIR • Evidence-Based Medicine</text>

    <!-- Highlights & Feature Chips -->
    <g transform="translate(0, 232)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="16" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">💡 10+ SaaS Leaders</text>

      <!-- Pill 2 -->
      <rect x="152" y="0" width="160" height="34" rx="8" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="168" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">⭐ Open-Source CDS</text>

      <!-- Pill 3 -->
      <rect x="324" y="0" width="150" height="34" rx="8" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="340" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">📊 Market Insights</text>
    </g>
  </g>
</svg>
